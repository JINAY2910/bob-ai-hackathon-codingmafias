<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="compute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#93c5fd"/>
    </marker>
    <marker id="goldArrow" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 16px Arial,sans-serif;fill:#cbd5e1}
      .section{font:700 20px Arial,sans-serif;fill:#e2e8f0}
      .head{font:700 17px Arial,sans-serif;fill:#fff}
      .text{font:400 13px Arial,sans-serif;fill:#dbeafe}
      .small{font:400 12px Arial,sans-serif;fill:#cbd5e1}
      .note{font:700 12px Arial,sans-serif;fill:#fde68a}
      .flow{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .gold{stroke:#fbbf24;stroke-width:3;fill:none;marker-end:url(#goldArrow)}
      .dashed{stroke-dasharray:9 7}
    </style>
  </defs>

  <rect width="1900" height="1250" fill="url(#bg)"/>
  <text x="65" y="62" class="title">PortFlow Feature 4 — Real 72-Hour Operations Plan Data Flow</text>
  <text x="65" y="92" class="subtitle">Historical replay inputs → ML prediction + optimizer + routing → shift plan → FastAPI → supervisor dashboard</text>

  <text x="65" y="145" class="section">1. Data is brought into the system</text>
  <g filter="url(#shadow)">
    <rect x="65" y="170" width="350" height="250" rx="16" fill="url(#input)" stroke="#5eead4"/>
    <text x="90" y="205" class="head">data/raw/ — source data</text>
    <text x="90" y="240" class="text">portcalls.csv</text>
    <text x="90" y="265" class="text">berths.csv</text>
    <text x="90" y="290" class="text">ml_port_day.csv</text>
    <text x="90" y="315" class="text">ports.csv</text>
    <text x="90" y="340" class="text">segments_port2port.csv</text>
    <text x="90" y="365" class="text">vesseltype_enriched.csv</text>
    <text x="90" y="397" class="note">Historical CSV inputs — not live AIS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="195" width="365" height="200" rx="16" fill="#334155" stroke="#94a3b8"/>
    <text x="525" y="230" class="head">Preprocessing scripts</text>
    <text x="525" y="265" class="text">src/data_processing.py</text>
    <text x="525" y="292" class="text">Cleans timestamps and joins vessel data</text>
    <text x="525" y="319" class="text">Counts berth capacity per port</text>
    <text x="525" y="355" class="text">src/feature_engineering.py</text>
    <text x="525" y="382" class="text">Creates port/day ML features</text>
  </g>
  <path d="M415 295 L500 295" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="950" y="195" width="390" height="200" rx="16" fill="#334155" stroke="#94a3b8"/>
    <text x="975" y="230" class="head">Generated intermediate files</text>
    <text x="975" y="270" class="text">data/processed/portcalls_processed.csv</text>
    <text x="975" y="300" class="text">data/processed/berths_capacity.csv</text>
    <text x="975" y="330" class="text">data/processed/engineered_features.csv</text>
    <text x="975" y="370" class="note">These files are read by Feature 4</text>
  </g>
  <path d="M865 295 L950 295" class="flow"/>

  <text x="65" y="470" class="section">2. Feature 4 reads three real decision sources</text>
  <g filter="url(#shadow)">
    <rect x="65" y="500" width="425" height="250" rx="16" fill="url(#compute)" stroke="#c4b5fd"/>
    <text x="90" y="535" class="head">A. Congestion prediction</text>
    <text x="90" y="570" class="text">Input: engineered_features.csv</text>
    <text x="90" y="598" class="text">Model: models/congestion_model.pkl</text>
    <text x="90" y="630" class="text">Filters by port_id and 72-hour dates</text>
    <text x="90" y="660" class="text">predict_proba(features) → probability</text>
    <text x="90" y="700" class="note">Output: port/day congestion probability</text>
    <text x="90" y="725" class="small">Example: probability 0.77 for a risky port-day</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="535" y="500" width="425" height="250" rx="16" fill="url(#compute)" stroke="#c4b5fd"/>
    <text x="560" y="535" class="head">B. Real berth/crane assignments</text>
    <text x="560" y="570" class="text">Input: data/feature2/results/</text>
    <text x="560" y="598" class="text">optimizer_assignments.csv</text>
    <text x="560" y="630" class="text">Reads ETA, service start/end</text>
    <text x="560" y="660" class="text">Reads assigned berth and crane IDs</text>
    <text x="560" y="700" class="note">Output: real vessel operational schedule</text>
    <text x="560" y="725" class="small">Also supplies waiting_time_hours/status</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1005" y="500" width="425" height="250" rx="16" fill="url(#compute)" stroke="#c4b5fd"/>
    <text x="1030" y="535" class="head">C. Alternate-port context</text>
    <text x="1030" y="570" class="text">Input: data/feature3/alternate_routes.csv</text>
    <text x="1030" y="610" class="text">Reads alternate port IDs and names</text>
    <text x="1030" y="640" class="text">Reads capacity and viability scores</text>
    <text x="1030" y="680" class="note">Output: contingency/fallback context</text>
    <text x="1030" y="720" class="small">Used when a hotspot needs diversion planning</text>
  </g>
  <path d="M1145 395 L277 500" class="flow dashed"/>
  <path d="M1145 395 L747 500" class="flow dashed"/>
  <path d="M1145 395 L1217 500" class="flow dashed"/>

  <text x="65" y="805" class="section">3. Planning engine constructs the 72-hour plan</text>
  <g filter="url(#shadow)">
    <rect x="65" y="835" width="520" height="285" rx="16" fill="url(#plan)" stroke="#fbbf24"/>
    <text x="90" y="875" class="head">src/planning/horizon_builder.py</text>
    <text x="90" y="915" class="text">1. Selects as_of timestamp and 72-hour horizon</text>
    <text x="90" y="945" class="text">2. Filters predictions to port/date window</text>
    <text x="90" y="975" class="text">3. Joins risk with optimizer assignment load</text>
    <text x="90" y="1005" class="text">4. Finds berth hotspots and risk levels</text>
    <text x="90" y="1035" class="text">5. Creates 3 × 24-hour shift blocks</text>
    <text x="90" y="1065" class="text">6. Creates actions for long-wait vessels</text>
    <text x="90" y="1095" class="text">7. Adds alternate-port contingencies</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="635" y="835" width="520" height="285" rx="16" fill="#78350f" stroke="#fbbf24"/>
    <text x="660" y="875" class="head">Structured OperationsPlan JSON</text>
    <text x="660" y="915" class="text">plan_id, generated_at, valid_until</text>
    <text x="660" y="945" class="text">overall_risk and congestion_hotspots</text>
    <text x="660" y="975" class="text">three shifts with planned_operations</text>
    <text x="660" y="1005" class="text">supervisor_actions and contingencies</text>
    <text x="660" y="1035" class="text">real vessel IDs, berth IDs, crane IDs</text>
    <text x="660" y="1075" class="note">This is the Feature 4 source of truth</text>
  </g>
  <path d="M490 625 L635 950" class="gold"/>
  <path d="M960 625 L635 980" class="gold"/>
  <path d="M1430 625 L635 1050" class="gold"/>
  <path d="M585 975 L635 975" class="gold"/>

  <g filter="url(#shadow)">
    <rect x="1205" y="835" width="330" height="285" rx="16" fill="url(#output)" stroke="#6ee7b7"/>
    <text x="1230" y="875" class="head">Explainability layer</text>
    <text x="1230" y="915" class="text">src/orchestration/</text>
    <text x="1230" y="945" class="text">llm_planner.py</text>
    <text x="1230" y="985" class="text">Reads structured plan JSON</text>
    <text x="1230" y="1015" class="text">Creates supervisor summary</text>
    <text x="1230" y="1060" class="note">Current: deterministic text</text>
    <text x="1230" y="1085" class="small">Replaceable with real LLM/RAG later</text>
  </g>
  <path d="M1155 975 L1205 975" class="gold"/>

  <g filter="url(#shadow)">
    <rect x="1585" y="835" width="260" height="285" rx="16" fill="#1e293b" stroke="#94a3b8"/>
    <text x="1610" y="875" class="head">FastAPI + dashboard</text>
    <text x="1610" y="915" class="text">GET /api/v1/</text>
    <text x="1610" y="940" class="text">operations-plan</text>
    <text x="1610" y="980" class="text">src/api/models.py</text>
    <text x="1610" y="1015" class="text">React timeline/cards</text>
    <text x="1610" y="1060" class="note">Supervisor sees actions</text>
    <text x="1610" y="1085" class="note">and approves/reviews them</text>
  </g>
  <path d="M1535 975 L1585 975" class="gold"/>

  <text x="65" y="1190" class="subtitle">Solid arrows = implemented data path | Dashed arrows = files consumed by the planner | Gold arrows = Feature 4 plan flow</text>
  <text x="65" y="1218" class="subtitle">Historical replay: the plan is reproducible with ?port_id=1&amp;as_of=2019-01-03T00:00:00Z</text>
</svg>
