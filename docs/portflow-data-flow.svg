<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="feature" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 19px Arial, sans-serif; fill: #e2e8f0; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #dbeafe; }
      .small { font: 400 12px Arial, sans-serif; fill: #cbd5e1; }
      .status { font: 700 12px Arial, sans-serif; fill: #fde68a; }
      .line { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .gold-line { stroke: #fbbf24; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
      .dashed { stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="70" y="65" class="title">PortFlow: End-to-End Data Flow and Backend Architecture</text>
  <text x="70" y="95" class="subtitle">Files - feature pipelines - FastAPI - operations plan - dashboard</text>

  <text x="70" y="145" class="section">1. Source data and preprocessing</text>
  <g filter="url(#shadow)">
    <rect x="70" y="170" width="300" height="190" rx="16" fill="#1e293b" stroke="#64748b"/>
    <text x="95" y="205" class="box-title">data/raw/</text>
    <text x="95" y="235" class="box-text">portcalls.csv</text>
    <text x="95" y="260" class="box-text">berths.csv</text>
    <text x="95" y="285" class="box-text">ml_port_day.csv</text>
    <text x="95" y="310" class="box-text">segments_port2port.csv</text>
    <text x="95" y="335" class="box-text">ports.csv + vessel types</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="190" width="300" height="150" rx="16" fill="#334155" stroke="#94a3b8"/>
    <text x="465" y="225" class="box-title">data_processing.py</text>
    <text x="465" y="255" class="box-text">Cleans timestamps</text>
    <text x="465" y="280" class="box-text">Joins vessel types</text>
    <text x="465" y="305" class="box-text">Counts berths by port</text>
  </g>
  <path d="M370 265 L440 265" class="line"/>
  <g filter="url(#shadow)">
    <rect x="810" y="190" width="300" height="150" rx="16" fill="#334155" stroke="#94a3b8"/>
    <text x="835" y="225" class="box-title">data/processed/</text>
    <text x="835" y="255" class="box-text">portcalls_processed.csv</text>
    <text x="835" y="280" class="box-text">berths_capacity.csv</text>
    <text x="835" y="305" class="box-text">engineered_features.csv</text>
  </g>
  <path d="M740 265 L810 265" class="line"/>

  <text x="70" y="415" class="section">2. Four feature areas</text>
  <g filter="url(#shadow)">
    <rect x="70" y="445" width="390" height="230" rx="16" fill="url(#feature)" stroke="#5eead4"/>
    <text x="95" y="480" class="box-title">Feature 1: Congestion prediction</text>
    <text x="95" y="510" class="box-text">feature_engineering.py</text>
    <text x="95" y="535" class="box-text">train_model.py / evaluate.py</text>
    <text x="95" y="570" class="box-text">XGBoost classifier</text>
    <text x="95" y="600" class="box-text">Inputs: arrivals, active vessels,</text>
    <text x="95" y="622" class="box-text">berths, utilization, forecast arrivals</text>
    <text x="95" y="655" class="status">Output: congestion probability + hotspot</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="445" width="390" height="230" rx="16" fill="url(#feature)" stroke="#5eead4"/>
    <text x="525" y="480" class="box-title">Feature 2: Berth/crane optimizer</text>
    <text x="525" y="510" class="box-text">optimizer/berth_crane_optimizer.py</text>
    <text x="525" y="540" class="box-text">Checks length, draft, crane limits,</text>
    <text x="525" y="562" class="box-text">availability, ETA and priority</text>
    <text x="525" y="600" class="box-text">Assigns berth + cranes + service window</text>
    <text x="525" y="630" class="box-text">Calculates waiting-time improvement</text>
    <text x="525" y="655" class="status">Output: optimizer_assignments.csv</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="445" width="390" height="230" rx="16" fill="url(#feature)" stroke="#5eead4"/>
    <text x="955" y="480" class="box-title">Feature 3: Alternate routing</text>
    <text x="955" y="510" class="box-text">routing/alternate_routing.py</text>
    <text x="955" y="540" class="box-text">Builds a bidirectional port graph</text>
    <text x="955" y="570" class="box-text">Combines traffic + berth capacity</text>
    <text x="955" y="600" class="box-text">Ranks connected alternate ports</text>
    <text x="955" y="655" class="status">Output: alternate_routes.csv</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1360" y="445" width="360" height="230" rx="16" fill="url(#plan)" stroke="#fbbf24"/>
    <text x="1385" y="480" class="box-title">Feature 4: 72-hour plan</text>
    <text x="1385" y="510" class="box-text">planning/horizon_builder.py</text>
    <text x="1385" y="545" class="box-text">Groups risk and actions into shifts</text>
    <text x="1385" y="575" class="box-text">Creates approvals and contingencies</text>
    <text x="1385" y="610" class="box-text">Generates supervisor summary</text>
    <text x="1385" y="655" class="status">Current plan data is demo/mock</text>
  </g>

  <path d="M240 360 L240 445" class="line"/>
  <path d="M965 340 L265 445" class="line dashed"/>
  <path d="M965 340 L695 445" class="line dashed"/>
  <path d="M965 340 L1125 445" class="line dashed"/>
  <path d="M460 560 L500 560" class="line"/>
  <path d="M890 560 L930 560" class="line"/>
  <path d="M1320 560 L1360 560" class="gold-line"/>

  <text x="70" y="735" class="section">3. Backend API and orchestration</text>
  <g filter="url(#shadow)">
    <rect x="70" y="765" width="370" height="245" rx="16" fill="url(#api)" stroke="#c4b5fd"/>
    <text x="95" y="800" class="box-title">FastAPI application</text>
    <text x="95" y="830" class="box-text">src/api/main.py</text>
    <text x="95" y="860" class="box-text">/api/v1/hotspots</text>
    <text x="95" y="885" class="box-text">/api/v1/optimize-berths</text>
    <text x="95" y="910" class="box-text">/api/v1/alternate-routes</text>
    <text x="95" y="935" class="box-text">/api/v1/operations-plan</text>
    <text x="95" y="970" class="box-text">Pydantic contracts in models.py</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="765" width="430" height="245" rx="16" fill="#4c1d95" stroke="#c4b5fd"/>
    <text x="525" y="800" class="box-title">Orchestration layer</text>
    <text x="525" y="835" class="box-text">Canonical events should merge</text>
    <text x="525" y="860" class="box-text">prediction + optimizer + routing</text>
    <text x="525" y="900" class="box-text">Priority actions and contingencies</text>
    <text x="525" y="930" class="box-text">Current state: structure started</text>
    <text x="525" y="970" class="status">End-to-end wiring still pending</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="990" y="765" width="350" height="245" rx="16" fill="#78350f" stroke="#fbbf24"/>
    <text x="1015" y="800" class="box-title">Explainability layer</text>
    <text x="1015" y="835" class="box-text">orchestration/llm_planner.py</text>
    <text x="1015" y="870" class="box-text">Converts plan JSON into readable</text>
    <text x="1015" y="895" class="box-text">supervisor instructions</text>
    <text x="1015" y="935" class="box-text">Current implementation is a</text>
    <text x="1015" y="960" class="status">deterministic IBM Bob mock</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1400" y="765" width="320" height="245" rx="16" fill="#1e293b" stroke="#64748b"/>
    <text x="1425" y="800" class="box-title">React dashboard</text>
    <text x="1425" y="835" class="box-text">src/dashboard-ui/</text>
    <text x="1425" y="870" class="box-text">72-hour plan timeline</text>
    <text x="1425" y="900" class="box-text">Risk cards and action cards</text>
    <text x="1425" y="930" class="box-text">Hotspot/berth/routing pages</text>
    <text x="1425" y="970" class="status">3D visualization not implemented</text>
  </g>

  <path d="M1550 675 L255 765" class="gold-line"/>
  <path d="M440 885 L500 885" class="line"/>
  <path d="M930 885 L990 885" class="gold-line"/>
  <path d="M1340 885 L1400 885" class="line"/>

  <text x="70" y="1060" class="subtitle">Solid arrows: implemented data path | Dashed arrows: planned/partially wired integration | Gold: operations-plan path</text>
</svg>
