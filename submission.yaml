submission:
  title: "PortFlow"
  problem_statement: >
    Port operators allocate berths, cranes, and yard space across hundreds of vessels
    manually in spreadsheets. Congestion hotspots are identified reactively, after vessels
    are already queuing, and by the time alternate routing decisions are made it is too
    late to help — the 2021 LA/Long Beach backlog had 100+ ships waiting offshore for
    weeks, costing global supply chains over $10B.
  solution_summary: >
    PortFlow predicts congestion hotspots ahead of time using vessel schedule and berth
    capacity data, recommends alternate routing strategies for vessels likely to be
    delayed, optimises berth and crane assignments to reduce turnaround time, and
    generates a rolling 72-hour port operations plan for shift supervisors.
  key_features:
    - "Congestion hotspot prediction from vessel ETAs and berth/yard capacity data"
    - "Berth and quay-crane assignment optimiser to reduce vessel waiting time"
    - "Alternate routing recommendations for vessels facing predicted delays"
    - "72-hour rolling port operations plan generated for shift supervisors"
    - "IBM Bob-guided investigation of why a hotspot is forming, in plain language"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite", "TailwindCSS"]
    ibm_technologies: ["IBM Bob LLM"]
    databases: ["Pandas/CSV"]
    other: ["Scikit-Learn", "XGBoost"]

  what_we_are_most_proud_of: >
    We are most proud of our Optimizer's mathematical proof. When we ran our heuristic scheduler against the full 1.48 million historical vessel records, it definitively proved that 858,000 vessels were fundamentally unassignable due to physical capacity constraints. This mathematically validated our entire project thesis: Optimization alone is not enough; you must predict and reroute traffic before it arrives.

  known_limitations: >
    Because we are using 2019 hackathon data, the "72-hour rolling window" operates on a simulated date rather than today's actual date. We also used "historical shipping lane traffic volume" as a proxy for geographic distance in our Alternate Routing engine to keep the MVP lightweight.

